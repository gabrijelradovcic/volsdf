[project]
name = "volsdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gputil>=1.4.0",
    "imageio>=2.37.2",
    "numpy>=2.2.6",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.90",
    "plotly>=6.5.2",
    "pyhocon>=0.3.61",
    "pytorch3d>=0.7.9",
    "rtree>=1.4.1",
    "scikit-image>=0.25.2",
    "torchvision>=0.25.0",
    "tqdm>=4.67.1",
    "trimesh>=4.11.1",
]

[[tool.uv.index]]
name = "torch_custom"
url = "https://miropsota.github.io/torch_packages_builder"
explicit = true

[tool.uv.sources]
pytorch3d = { index = "torch_custom" }
