train{
    expname = Changwei8_multiframe
    dataset_class = datasets.scene_dataset.SceneDataset
    model_class = model.network.VolSDFNetwork
    loss_class = model.loss.VolSDFLoss
    learning_rate = 5.0e-4
    num_pixels = 1024
    checkpoint_freq = 100
    plot_freq = 2
    split_n_pixels = 1000
    pose_freeze_epochs = 4
}
plot{
    plot_nimgs = 1
    resolution = 512
    grid_boundary = [-1.5, 1.5]
}
loss{
    eikonal_weight = 0.2
    rgb_loss = torch.nn.L1Loss
    pose_reg_weight = 0.1
}
dataset{
    data_dir = Changwei8
    img_res = [751, 1023]
    scan_id = 2
    obj_pose_path = /data/gradovcic/output/20250226_Chengwei_Take8/obj_pose.npy
    frame_skip = 1
}
model{
    feature_vector_size = 256
    scene_bounding_sphere = 9.0
    implicit_network
    {
        d_in = 3
        d_out = 1
        dims = [ 256, 256, 256, 256, 256, 256, 256, 256 ]
        geometric_init = True
        bias = 1.2
        skip_in = [4]
        weight_norm = True
        multires = 6
        sphere_scale = 1
    }
    rendering_network
    {
        mode = idr
        d_in = 9
        d_out = 3
        dims = [ 256, 256, 256, 256]
        weight_norm = True
        multires_view = 4
    }
    density
    {
        params_init{
            beta = 0.1
        }
        beta_min = 0.0001
    }
    ray_sampler
    {
        near = 0.0
        N_samples = 64
        N_samples_eval = 128
        N_samples_extra = 32
        eps = 0.1
        beta_iters = 10
        max_total_iters = 5
    }
}
